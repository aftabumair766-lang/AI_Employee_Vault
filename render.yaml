# Render.com Blueprint - AI Employee Vault
# https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard → New → Blueprint → Connect repo
# Render reads this file and creates services automatically.
#
# NOTE: Set secret env vars (IMAP password etc.) in Render Dashboard
# after deploy. This file only contains non-sensitive defaults.

services:
  - type: web
    name: ai-employee-vault
    runtime: docker
    plan: free
    dockerfilePath: Platinum/deploy/Dockerfile.render
    dockerContext: .
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PLATINUM_AGENT_ROLE
        value: cloud
      - key: PLATINUM_VAULT_PATH
        value: /opt/ai-employee/vault
      - key: PLATINUM_DATABASE_URL
        value: sqlite:///./ai_employee.db
      - key: PLATINUM_IMAP_HOST
        value: imap.gmail.com
      - key: PLATINUM_IMAP_PORT
        value: "993"
      - key: PLATINUM_IMAP_USER
        sync: false  # set in Render Dashboard
      - key: PLATINUM_IMAP_PASSWORD
        sync: false  # set in Render Dashboard
      - key: PLATINUM_ODOO_URL
        value: ""
      - key: PLATINUM_SYNC_INTERVAL
        value: "300"
      - key: PLATINUM_HEARTBEAT_INTERVAL
        value: "30"
      - key: PLATINUM_HEALTH_CHECK_INTERVAL
        value: "60"
