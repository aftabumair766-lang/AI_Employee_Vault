; AI Employee - Supervisord Configuration for Render.com
; Runs all services in a single container
;
; Programs:
;   api            - FastAPI server (web-facing, port from $PORT)
;   cloud-agent    - Background cloud agent (claims, drafts, triages)
;   health-monitor - Health monitoring daemon
;   sync-daemon    - Git vault sync daemon

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; === FastAPI API Server (web-facing) ===
[program:api]
command=python -m uvicorn api.main:app --host 0.0.0.0 --port %(ENV_PORT)s
directory=/opt/ai-employee
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; === Cloud Agent (background worker) ===
[program:cloud-agent]
command=python -c "from Platinum.src.cloud_agent import CloudAgent; agent = CloudAgent(); agent.start()"
directory=/opt/ai-employee
autostart=true
autorestart=true
startretries=5
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

; === Health Monitor Daemon ===
[program:health-monitor]
command=python -m Platinum.src.health_monitor_daemon
directory=/opt/ai-employee
autostart=true
autorestart=true
startretries=5
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

; === Sync Daemon (git push/pull) ===
[program:sync-daemon]
command=python -m Platinum.src.sync_daemon
directory=/opt/ai-employee
autostart=true
autorestart=true
startretries=5
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40
