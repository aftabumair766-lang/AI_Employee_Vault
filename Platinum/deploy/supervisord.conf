; AI Employee - Supervisord Configuration (All-in-One Container)
; Runs all services in a single container for HuggingFace Spaces
;
; Programs:
;   postgresql     - PostgreSQL 15 database engine
;   odoo           - Odoo 17 ERP system
;   caddy          - Reverse proxy (port 7860)
;   api            - FastAPI server (port 8000)
;   cloud-agent    - Background cloud agent (claims, drafts, triages)
;   health-monitor - Health monitoring daemon
;   sync-daemon    - Git vault sync daemon

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; === PostgreSQL 15 (must start first) ===
[program:postgresql]
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/15/main
user=postgres
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=1

; === Odoo 17 ERP ===
[program:odoo]
command=/usr/bin/odoo --config=/etc/odoo/odoo.conf
user=odoo
autostart=true
autorestart=true
startretries=5
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=5

; === Caddy Reverse Proxy (port 7860) ===
[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
startretries=5
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=8

; === FastAPI API Server (port 8000) ===
[program:api]
command=python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
directory=/opt/ai-employee
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; === Cloud Agent (background worker) ===
[program:cloud-agent]
command=python -c "from Platinum.src.cloud_agent import CloudAgent; agent = CloudAgent(); agent.start()"
directory=/opt/ai-employee
autostart=true
autorestart=true
startretries=5
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

; === Health Monitor Daemon ===
[program:health-monitor]
command=python -m Platinum.src.health_monitor_daemon
directory=/opt/ai-employee
autostart=true
autorestart=true
startretries=5
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

; === Sync Daemon (git push/pull) ===
[program:sync-daemon]
command=python -m Platinum.src.sync_daemon
directory=/opt/ai-employee
autostart=true
autorestart=true
startretries=5
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40
