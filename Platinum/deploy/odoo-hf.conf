[options]
; Odoo 17 configuration for HuggingFace Spaces (single container)
; Optimized for free-tier resources (16GB RAM, 2 vCPU)

; Database
db_host = localhost
db_port = 5432
db_user = odoo
db_password = odoo
db_name = odoo
db_template = template0

; Networking
http_port = 8069
longpolling_port = 8072
proxy_mode = True

; Performance (threaded mode, no workers = saves RAM)
workers = 0
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_time_cpu = 600
limit_time_real = 1200

; Logging
log_level = warn
logfile = /dev/stdout

; Data
data_dir = /var/lib/odoo

; Addons
addons_path = /usr/lib/python3/dist-packages/odoo/addons

; Security
list_db = False
admin_passwd = admin
